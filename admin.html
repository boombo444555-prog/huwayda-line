<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة Huwayda Line</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--pink:#f4c6dc;--deep:#a33e76;--purple:#8b70a9;--ink:#493747;--soft:#fff7fb}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:Tahoma,Arial,sans-serif}header{padding:20px 5%;background:linear-gradient(120deg,#f8d9e8,#eee3fa);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0;color:var(--deep)}main{max-width:1000px;margin:25px auto;padding:0 16px}.panel{background:white;border:1px solid #f0dce8;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 5px 18px #8b477012}input,textarea,select{width:100%;padding:12px;border:1px solid #e7cddd;border-radius:10px;margin:6px 0 14px;font:inherit}label{font-weight:bold}.btn{border:0;background:var(--deep);color:white;padding:11px 18px;border-radius:24px;cursor:pointer;font-weight:bold}.btn.secondary{background:#8b70a9}.btn.danger{background:#a33e45}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.product{border:1px solid #f0dce8;border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center}.product img{width:76px;height:90px;object-fit:cover;border-radius:9px;background:#f8e8f0}.muted{color:#927d8d;font-size:13px}.hidden{display:none!important}#message{margin:12px 0;color:var(--deep);white-space:pre-wrap}
</style></head><body>
<header><div><h1>HUWAYDA LINE ♡</h1><div id="adminSubtitle">لوحة إدارة المتجر</div></div><div><select id="adminLanguage" aria-label="Language" style="padding:9px;border:1px solid #e7cddd;border-radius:10px;background:white;font:inherit"><option value="ar">العربية</option><option value="he">עברית</option><option value="en">English</option></select><a href="./" style="color:#a33e76">عرض المتجر</a> <button id="logout" class="btn secondary hidden">تسجيل خروج</button></div></header>
<main>
<section id="login" class="panel"><h2>دخول الإدارة</h2><p class="muted">هذه الصفحة مخصصة لحساب الإدارة الوحيد.</p><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" class="btn">دخول</button></section>
<section id="dashboard" class="hidden">
<div class="panel"><h2 id="formTitle">إضافة منتج جديد</h2><form id="productForm">
<input id="productId" type="hidden"><div class="grid"><div><label>رقم القطعة</label><input id="code" required placeholder="HL-006"></div><div><label>اسم القطعة (عربي)</label><input id="name" required></div><div><label>اسم القطعة (עברית)</label><input id="nameHe" required></div><div><label>اسم القطعة (English)</label><input id="nameEn" required></div><div><label>السعر (₪)</label><input id="price" type="number" min="0" step="0.01" required></div><div><label>التصنيف</label><select id="category"><option value="sport">Sport Wear</option><option value="casual">Casual Wear</option><option value="dress">Dresses</option><option value="used">Pre-Loved</option><option value="swim">Swimwear / ملابس سباحة</option><option value="lingerie">Lingerie / ملابس داخلية</option></select></div><div><label>المقاسات</label><input id="sizes" placeholder="S / M / L"></div><div><label>الألوان</label><input id="colors" placeholder="أسود، وردي"></div></div><label>الوصف (عربي)</label><textarea id="description" rows="3"></textarea><label>الوصف (עברית)</label><textarea id="descriptionHe" rows="2"></textarea><label>الوصف (English)</label><textarea id="descriptionEn" rows="2"></textarea><label>صورة المنتج</label><input id="photo" type="file" accept="image/png,image/jpeg,image/webp"><div id="currentImage" class="muted"></div><label><input id="active" type="checkbox" checked style="width:auto;margin-left:8px">عرض المنتج في المتجر</label><p><button class="btn" type="submit">حفظ المنتج</button> <button class="btn secondary" type="button" id="reset">تفريغ الحقول</button></p></form><div id="message"></div></div>
<div class="panel"><h2>المنتجات الحالية</h2><div id="products" class="grid">جاري التحميل...</div></div>
</section></main>
<script src="./config.js"></script><script>
const cfg=window.HUWAYDA_CONFIG||{};const ready=cfg.supabaseUrl&&cfg.supabaseAnonKey&&!cfg.supabaseUrl.includes('YOUR_');const client=ready?supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey):null;
const $=id=>document.getElementById(id);let current=[];
function msg(t){$('message').textContent=t}
function showDash(on){$('login').classList.toggle('hidden',on);$('dashboard').classList.toggle('hidden',!on);$('logout').classList.toggle('hidden',!on)}
async function refresh(){const {data,error}=await client.from('products').select('*').order('created_at',{ascending:false});if(error){$('products').textContent=error.message;return}current=data||[];$('products').innerHTML=current.map(p=>'<article class="product">'+(p.image_url?'<img src="'+p.image_url+'" alt="">':'<div style="width:76px">🐱</div>')+'<div style="min-width:0"><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.code)+' · '+Number(p.price).toFixed(2)+' ₪</div><div class="muted">'+(p.active?'ظاهر':'مخفي')+'</div><button class="btn secondary" onclick="editProduct(\''+p.id+'\')">تعديل</button> <button class="btn danger" onclick="deleteProduct(\''+p.id+'\')">حذف</button></div></article>').join('')||'لا توجد منتجات بعد.'}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.editProduct=id=>{const p=current.find(x=>x.id===id);if(!p)return;$('productId').value=p.id;$('code').value=p.code;$('name').value=p.name;$('nameHe').value=p.name_he||'';$('nameEn').value=p.name_en||'';$('price').value=p.price;$('category').value=p.category;$('sizes').value=p.sizes||'';$('colors').value=p.colors||'';$('description').value=p.description||'';$('descriptionHe').value=p.description_he||'';$('descriptionEn').value=p.description_en||'';$('active').checked=p.active;$('currentImage').textContent=p.image_url?'الصورة الحالية محفوظة.':'';$('formTitle').textContent='تعديل المنتج';window.scrollTo({top:0,behavior:'smooth'})};
window.deleteProduct=async id=>{if(!confirm('متأكد من حذف المنتج؟'))return;const {error}=await client.from('products').delete().eq('id',id);if(error)alert(error.message);else refresh()};
$('loginBtn').onclick=async()=>{if(!ready){alert('لازم إعداد Supabase أولاً: أضف الرابط والمفتاح في config.js وشغّل schema.sql.');return}const {error}=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){alert('تعذر تسجيل الدخول: '+error.message);return}showDash(true);refresh()};
$('logout').onclick=async()=>{await client.auth.signOut();showDash(false)};
$('reset').onclick=()=>{$('productForm').reset();$('productId').value='';$('currentImage').textContent='';$('formTitle').textContent='إضافة منتج جديد'};
$('productForm').onsubmit=async e=>{e.preventDefault();if(!client)return;msg('جاري الحفظ...');let imageUrl=current.find(p=>p.id===$('productId').value)?.image_url||'';const file=$('photo').files[0];if(file){if(file.size>5*1024*1024){msg('حجم الصورة أكبر من 5 ميغابايت.');return}const ext=file.name.split('.').pop().toLowerCase();const path=Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;const up=await client.storage.from('product-images').upload(path,file,{upsert:false,contentType:file.type});if(up.error){msg('فشل رفع الصورة: '+up.error.message);return}imageUrl=client.storage.from('product-images').getPublicUrl(path).data.publicUrl}
const item={code:$('code').value.trim(),name:$('name').value.trim(),name_he:$('nameHe').value.trim(),name_en:$('nameEn').value.trim(),price:Number($('price').value),category:$('category').value,sizes:$('sizes').value.trim(),colors:$('colors').value.trim(),description:$('description').value.trim(),description_he:$('descriptionHe').value.trim(),description_en:$('descriptionEn').value.trim(),active:$('active').checked,image_url:imageUrl,updated_at:new Date().toISOString()};
const id=$('productId').value;const result=id?await client.from('products').update(item).eq('id',id):await client.from('products').insert(item);if(result.error){msg('تعذر حفظ المنتج: '+result.error.message);return}msg('تم حفظ المنتج بنجاح.');$('productForm').reset();$('productId').value='';$('currentImage').textContent='';$('formTitle').textContent='إضافة منتج جديد';refresh()};
(async()=>{if(!ready){$('login').insertAdjacentHTML('beforeend','<p class="muted">الإعداد التقني لم يكتمل بعد. بعد ربط قاعدة البيانات سنفعّل الدخول.</p>');return}const {data}=await client.auth.getSession();if(data.session){showDash(true);refresh()}})();
</script>
<script>
(function(){
const dict={
en:{
"لوحة إدارة المتجر":"Store Admin","عرض المتجر":"View Store","تسجيل خروج":"Log out","دخول الإدارة":"Admin Login","هذه الصفحة مخصصة لحساب الإدارة الوحيد.":"This page is for the single admin account.",
"البريد الإلكتروني":"Email address","كلمة المرور":"Password","دخول":"Sign in","إضافة منتج جديد":"Add New Product","رقم القطعة":"Item code","اسم القطعة":"Product name","اسم القطعة (عربي)":"Product name (Arabic)","اسم القطعة (עברית)":"Product name (Hebrew)","اسم القطعة (English)":"Product name (English)","الوصف (عربي)":"Description (Arabic)","الوصف (עברית)":"Description (Hebrew)","الوصف (English)":"Description (English)","السعر (₪)":"Price (₪)","التصنيف":"Category","المقاسات":"Sizes","الألوان":"Colors","الوصف":"Description","صورة المنتج":"Product image","عرض المنتج في المتجر":"Show product in store","حفظ المنتج":"Save product","تفريغ الحقول":"Clear form","المنتجات الحالية":"Current products","Sport Wear":"Sport Wear","Casual Wear":"Casual Wear","Dresses":"Dresses","Pre-Loved":"Pre-Loved","Swimwear / ملابس سباحة":"Swimwear","Lingerie / ملابس داخلية":"Lingerie"
},
he:{
"لوحة إدارة المتجر":"ניהול החנות","عرض المتجر":"צפייה בחנות","تسجيل خروج":"התנתקות","دخول الإدارة":"כניסת מנהלת","هذه الصفحة مخصصة لحساب الإدارة الوحيد.":"עמוד זה מיועד לחשבון מנהלת יחיד.",
"البريد الإلكتروني":"כתובת אימייל","كلمة المرور":"סיסמה","دخول":"כניסה","إضافة منتج جديد":"הוספת מוצר חדש","رقم القطعة":"מספר פריט","اسم القطعة":"שם המוצר","اسم القطعة (عربي)":"שם המוצר (ערבית)","اسم القطعة (עברית)":"שם המוצר (עברית)","اسم القطعة (English)":"שם המוצר (אנגלית)","الوصف (عربي)":"תיאור (ערבית)","الوصف (עברית)":"תיאור (עברית)","الوصف (English)":"תיאור (אנגלית)","السعر (₪)":"מחיר (₪)","التصنيف":"קטגוריה","المقاسات":"מידות","الألوان":"צבעים","الوصف":"תיאור","صورة المنتج":"תמונת מוצר","عرض المنتج في المتجر":"הצגת המוצר בחנות","حفظ المنتج":"שמירת מוצר","تفريغ الحقول":"ניקוי הטופס","المنتجات الحالية":"המוצרים הקיימים","Sport Wear":"בגדי ספורט","Casual Wear":"בגדי יום-יום","Dresses":"שמלות","Pre-Loved":"יד שנייה","Swimwear / ملابس سباحة":"בגדי ים","Lingerie / ملابس داخلية":"הלבשה תחתונה"
}};
const original=new WeakMap();
function apply(lang){
document.documentElement.lang=lang;document.documentElement.dir=lang==="en"?"ltr":"rtl";
const walk=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
let n;while(n=walk.nextNode()){if(!original.has(n))original.set(n,n.nodeValue);const raw=original.get(n),key=raw.trim(),v=dict[lang]?.[key];if(v){const next=raw.replace(key,v);if(n.nodeValue!==next)n.nodeValue=next}}
document.title=lang==="ar"?"إدارة Huwayda Line":lang==="he"?"ניהול Huwayda Line":"Huwayda Line Admin";
}
const select=document.getElementById("adminLanguage");const saved=localStorage.getItem("huwayda-language")||"ar";select.value=saved;select.addEventListener("change",()=>{localStorage.setItem("huwayda-language",select.value);apply(select.value)});
const observer=new MutationObserver(()=>apply(select.value));observer.observe(document.body,{childList:true,subtree:true});apply(saved);select.addEventListener("change",()=>{if(typeof refresh==="function"&&!document.getElementById("dashboard").classList.contains("hidden"))refresh()});
})();
</script></body></html>
